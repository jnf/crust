# crust — MPD config (shared, deployable layer).
#
# What's specific to one box (music_directory, your DAC's output, a LAN bind)
# is NOT here; it lives in mpd_local.conf, pulled in by the include at the
# bottom. Copy mpd_local.conf.example to /etc/mpd_local.conf and fill in your own.
#
# Deploy:  sudo cp config/mpd.conf /etc/mpd.conf && sudo systemctl restart mpd

playlist_directory	"/var/lib/mpd/playlists"
db_file			"/var/lib/mpd/tag_cache"
state_file		"/var/lib/mpd/state"
# Drop to Debian's unprivileged mpd user (in group audio). mpd.service has no
# User=, so without this line mpd stays root. Never the login user: mpd may
# listen on the LAN, and the login user has sudo.
user			"mpd"

input {
	plugin "curl"
}

decoder {
	plugin		"hybrid_dsd"
	enabled		"no"
}
decoder {
	plugin		"wildmidi"
	enabled		"no"
}

filesystem_charset	"UTF-8"
audio_buffer_size	"32768"		# 32 MB — prevents SD-card-latency xruns (debug-log 2026-02-22)

# Visualizer feed: raw PCM to a FIFO for CAVA. Independent of the playback
# output (in mpd_local.conf) -- keep enabled regardless of where audio is routed.
audio_output {
	type		"fifo"
	name		"CAVA FIFO"
	path		"/tmp/mpd.fifo"
	format		"44100:16:2"
}

# Machine-specific settings: music_directory, playback output(s), bind. Not
# tracked; see mpd_local.conf.example.
include_optional "mpd_local.conf"
