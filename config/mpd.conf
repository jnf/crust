# crust — MPD config (shared, deployable layer).
#
# Machine-specific settings (music_directory, user) are NOT here — they live in
# mpd_local.conf, pulled in by the include at the bottom. Copy
# mpd_local.conf.example to /etc/mpd_local.conf and fill in your own.
#
# Deploy:  sudo cp config/mpd.conf /etc/mpd.conf && sudo systemctl restart mpd

playlist_directory	"/var/lib/mpd/playlists"
db_file			"/var/lib/mpd/tag_cache"
state_file		"/var/lib/mpd/state"
sticker_file		"/var/lib/mpd/sticker.sql"
bind_to_address		"localhost"

input {
	plugin "curl"
}

decoder {
	plugin		"hybrid_dsd"
	enabled		"no"
}
decoder {
	plugin		"wildmidi"
	enabled		"no"
}

filesystem_charset	"UTF-8"
audio_buffer_size	"32768"		# 32 MB — prevents SD-card-latency xruns (debug-log 2026-02-22)

# Primary playback: a USB DAC. CARD=Audio is the device's ALSA id (stable across
# card-number reshuffles); set it to match your hardware (`aplay -l`). plughw,
# not hw — the plugin layer converts our PCM to the DAC's native format. The
# reference build uses a NAD D3045.
audio_output {
	type		"alsa"
	name		"NAD USB DAC"
	device		"plughw:CARD=Audio,DEV=0"
	mixer_type	"software"
}

# Fallback playback: HDMI → audio extractor → S/PDIF. Disabled by default.
# Switch at runtime: mpc disable "NAD USB DAC" && mpc enable "HDMI Audio"
audio_output {
	type		"alsa"
	name		"HDMI Audio"
	device		"plughw:vc4hdmi,0"
	mixer_type	"software"
	enabled		"no"
}

# Visualizer feed: raw PCM to a FIFO for CAVA. Independent of the playback
# device above — keep enabled regardless of where audio is routed.
audio_output {
	type		"fifo"
	name		"CAVA FIFO"
	path		"/tmp/mpd.fifo"
	format		"44100:16:2"
}

# Machine-specific overrides (music_directory, user). Not tracked; see
# mpd_local.conf.example.
include_optional "mpd_local.conf"
