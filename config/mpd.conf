# crust — MPD config (shared, deployable layer).
#
# The machine-specific setting (music_directory) is NOT here; it lives in
# mpd_local.conf, pulled in by the include at the bottom. Copy
# mpd_local.conf.example to /etc/mpd_local.conf and fill in your own.
#
# Deploy:  sudo cp config/mpd.conf /etc/mpd.conf && sudo systemctl restart mpd

playlist_directory	"/var/lib/mpd/playlists"
db_file			"/var/lib/mpd/tag_cache"
state_file		"/var/lib/mpd/state"
sticker_file		"/var/lib/mpd/sticker.sql"
# Drop to Debian's unprivileged mpd user (in group audio). mpd.service has no
# User=, so without this line mpd stays root. Never the login user: mpd listens
# on the LAN, and the login user has sudo.
user			"mpd"
# Listen on all interfaces: the wallbox (tspine) reaches mpd over the network.
# Debian's mpd.socket used to override a "localhost" bind silently; don't rely on it.
bind_to_address		"any"

input {
	plugin "curl"
}

decoder {
	plugin		"hybrid_dsd"
	enabled		"no"
}
decoder {
	plugin		"wildmidi"
	enabled		"no"
}

filesystem_charset	"UTF-8"
audio_buffer_size	"32768"		# 32 MB — prevents SD-card-latency xruns (debug-log 2026-02-22)

# Playback targets: one output per known USB card, and exactly one enabled at a
# time. bars-output switches them (enableoutput / disableoutput), and runs at
# mpd start to settle on one. Leave every output enabled here: mpd's state file
# can only ever *disable* an output on restore (a stored "enabled" is a no-op in
# src/output/State.cxx), so an `enabled "no"` would never come back on after a
# restart (debug-log 2026-11-11). Cards are matched by ALSA id (stable across
# card-number reshuffles; find yours with `aplay -l`). plughw, not hw: the
# plugin layer converts our PCM to the card's native format. A new device is one
# more stanza here. (bars plans/two-node.md, Phase 2.)

# The NAD D3045, the reference build's DAC.
audio_output {
	type		"alsa"
	name		"NAD"
	device		"plughw:CARD=Audio,DEV=0"
	mixer_type	"software"
}

# Sennheiser MOMENTUM 3 cans. They take 48000/16 only, so mpd resamples with its
# own libsamplerate rather than ALSA plug's linear converter (debug-log
# 2026-11-09).
audio_output {
	type		"alsa"
	name		"Cans"
	device		"plughw:CARD=M3,DEV=0"
	mixer_type	"software"
	format		"48000:16:2"
}

# Visualizer feed: raw PCM to a FIFO for CAVA. Independent of the playback
# device above — keep enabled regardless of where audio is routed.
audio_output {
	type		"fifo"
	name		"CAVA FIFO"
	path		"/tmp/mpd.fifo"
	format		"44100:16:2"
}

# Machine-specific overrides (music_directory). Not tracked; see
# mpd_local.conf.example.
include_optional "mpd_local.conf"
