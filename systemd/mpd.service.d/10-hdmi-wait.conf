# Wait for the vc4-hdmi ALSA device to be openable before MPD starts.
#
# On boot, the HDMI link negotiation takes ~3 minutes. MPD starting too
# early gets "Unknown error 524" (device not ready) and silently fails to
# open the audio output. This ExecStartPre blocks until the device accepts
# a 1-second silent probe, establishing the link before MPD tries to use it.
[Service]
ExecStartPre=/bin/bash -c 'until aplay -D plughw:vc4hdmi,0 -f S16_LE -r 44100 -c 2 -d 1 /dev/zero -q 2>/dev/null; do sleep 5; done'
TimeoutStartSec=600
