# Give a USB audio card a moment before starting MPD -- but start it regardless.
#
# MPD opening an ALSA output before the device is ready gets "Unknown error
# 524" (device not ready). On a Pi Zero behind a USB hub there can be a brief
# post-boot race before a present card is openable, so loop a 1-second silent
# probe across every card mpd.conf knows until one accepts.
#
# The difference from the old NAD-only wait: no card is not a failure. The NAD
# sits behind a shared USB switch and is often absent at boot; the old wait
# timed out and took mpd and its cascade down with it. Now mpd starts after 60s
# with no card, and bars-output picks one up when it appears.
#
# The card ids come from the alsa devices in mpd.conf and mpd_local.conf, so a
# new card is one stanza in either file and nothing here.
#
# Once mpd is up, bars-output settles on exactly one playback output: every
# output starts enabled (see mpd.conf), so a fresh box would otherwise play to
# all of them. (bars plans/two-node.md, Phase 2.)
[Service]
ExecStartPre=/bin/bash -c 'cards=$$(grep -ho "CARD=[A-Za-z0-9_]*" /etc/mpd.conf /etc/mpd_local.conf 2>/dev/null | cut -d= -f2 | sort -u); for i in $$(seq 12); do for c in $$cards; do aplay -D plughw:CARD=$$c,DEV=0 -f S16_LE -r 48000 -c 2 -d 1 /dev/zero -q 2>/dev/null && exit 0; done; sleep 4; done; echo "no audio card after 60s; starting mpd anyway"'
ExecStartPost=/usr/local/bin/bars-output auto
TimeoutStartSec=90
