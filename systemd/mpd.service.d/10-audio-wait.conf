# Wait for a usable audio output device before starting MPD.
#
# MPD opening its ALSA output before the device is ready gets "Unknown error
# 524" (device not ready) and silently fails. Two devices can back playback:
#
#   - NAD USB DAC (primary): enumerates fast, but on a Pi Zero behind a USB
#     hub there can be a brief post-boot race before it's openable.
#   - HDMI/OREI (fallback): cold-boot link negotiation takes ~3 minutes.
#
# Probe the NAD first (the common case, succeeds in <1s); fall through to HDMI
# so an HDMI-only fallback boot also waits correctly. Unblock as soon as either
# accepts a 1-second silent probe. Timeout stays generous for the HDMI case.
[Service]
ExecStartPre=/bin/bash -c 'until aplay -D plughw:CARD=Audio,DEV=0 -f S16_LE -r 44100 -c 2 -d 1 /dev/zero -q 2>/dev/null || aplay -D plughw:vc4hdmi,0 -f S16_LE -r 44100 -c 2 -d 1 /dev/zero -q 2>/dev/null; do sleep 5; done'
TimeoutStartSec=600
