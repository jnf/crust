# Wait for the USB DAC before starting MPD.
#
# MPD opening its ALSA output before the device is ready gets "Unknown error
# 524" (device not ready) and silently fails. The NAD enumerates fast, but on a
# Pi Zero behind a USB hub there can be a brief post-boot race before it's
# openable. Loop a 1-second silent probe until it accepts, then unblock MPD.
#
# CARD=Audio is the NAD's ALSA id; match it to mpd.conf's device.
[Service]
ExecStartPre=/bin/bash -c 'until aplay -D plughw:CARD=Audio,DEV=0 -f S16_LE -r 44100 -c 2 -d 1 /dev/zero -q 2>/dev/null; do sleep 5; done'
TimeoutStartSec=60
