# Correct the IEC958 channel-status AES3 byte after MPD opens the HDMI device.
#
# MPD's ALSA plugin resets AES3 to 0x01 ("sample rate not indicated") when it
# opens the vc4-hdmi device. Some HDMI audio extractors (e.g. OREI BK-41A) use
# this byte for S/PDIF clock recovery and stutter when it reads "not indicated."
#
# Only relevant on the HDMI/OREI fallback path. Addressed by card *id*
# (vc4hdmi), not index, because the NAD USB DAC now occupies card 0 and shifts
# HDMI to a higher index. Guarded on the control existing, and always exits 0,
# so on the USB path (NAD has no IEC958 control) this is a harmless no-op and
# can never fail MPD's startup.
[Service]
ExecStartPost=/bin/bash -c 'sleep 2; amixer -c vc4hdmi cget numid=4 >/dev/null 2>&1 && amixer -c vc4hdmi cset numid=4 AES0=0x04,AES1=0x00,AES2=0x00,AES3=0x00 >/dev/null 2>&1; exit 0'
